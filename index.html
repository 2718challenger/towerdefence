<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<title>타워 디펜스</title>
<style>
:root{--bg:#eef1f5;--fg:#1a2230;--card:#fff;--line:#d3d9e2;--mut:#5d6878;--acc:#2f5fe0;--bad:#d23b4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141c;--fg:#e6ebf3;--card:#18202c;--line:#2a3547;--mut:#97a3b6;--acc:#6f95ff;--bad:#ff6b79;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f141c;--fg:#e6ebf3;--card:#18202c;--line:#2a3547;--mut:#97a3b6;--acc:#6f95ff;--bad:#ff6b79;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;line-height:1.45}
main{max-width:680px;margin:0 auto;padding:14px}
h1{font-size:1.25rem;margin:0 0 10px}
.hud{display:flex;gap:8px;margin-bottom:8px}
.hud span{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:.9rem;color:var(--mut)}
.hud b{color:var(--fg);font-size:1.05rem}
.wrap{position:relative}
canvas{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);touch-action:manipulation;cursor:crosshair}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(10,14,22,.78);border-radius:10px;color:#fff;text-align:center}
.ov[hidden]{display:none}
.ov h2{margin:0;font-size:1.6rem}
.tb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 6px;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.tb button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.85rem}
.tb button i{width:18px;height:18px;border-radius:50%;display:block}
.tb button small{color:var(--mut)}
.tb button.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc) inset}
.info{min-height:64px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.88rem;color:var(--mut)}
.info strong{color:var(--fg)}
.row{display:flex;gap:6px;margin-top:6px}
.row button{flex:1}
.ctl{display:flex;gap:6px;margin-top:8px}
.ctl button{flex:1}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.ov .pri{padding:10px 22px}
.ov h2{font-size:1.3rem}
.stl{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:92%;max-width:420px}
.stl button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px}
.stl small{color:var(--mut)}
.stl svg{border-radius:4px;border:1px solid var(--line);width:100%;max-width:96px;height:auto}
:root{--bg:#2f4d41;--bgfg:#f3e9cf;--fg:#3a2917;--card:#f2e7c9;--card2:#e4d3a6;--line:#3a2917;--mut:#7d6746;--acc:#c8541f;--bad:#b3261e;--gold:#e8ae33;--wood:#6b4423;--sh:#1d130a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16231d;--bgfg:#e8dcc0;--fg:#eadcb8;--card:#2c2419;--card2:#3b3021;--line:#0e0a06;--mut:#b09a73;--acc:#e8883f;--bad:#ff7a6e;--gold:#f0b83a;--wood:#4a2f17;--sh:#000}}
:root[data-theme="dark"]{--bg:#16231d;--bgfg:#e8dcc0;--fg:#eadcb8;--card:#2c2419;--card2:#3b3021;--line:#0e0a06;--mut:#b09a73;--acc:#e8883f;--bad:#ff7a6e;--gold:#f0b83a;--wood:#4a2f17;--sh:#000}
body{background-color:var(--bg);background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.6px);background-size:15px 15px;color:var(--bgfg);font-family:"Gowun Dodum","Noto Sans KR","Malgun Gothic",sans-serif}
main{padding:16px 14px 32px}
h1{display:inline-block;font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;font-size:1.9rem;letter-spacing:.02em;color:var(--gold);text-shadow:2px 3px 0 var(--sh);transform:rotate(-1.5deg);margin:2px 0 14px 4px}
h1::after{content:"";display:block;height:5px;width:70%;background:var(--gold);border-radius:3px;transform:rotate(1deg);margin-top:1px;box-shadow:1px 2px 0 var(--sh)}
.hud{gap:10px;margin-bottom:12px}
.hud span{background:var(--wood);color:#f1dfb8;border:3px solid var(--sh);border-radius:6px 11px 7px 10px;box-shadow:3px 4px 0 var(--sh);font-family:"Jua",sans-serif;font-size:.85rem;padding:5px 10px}
.hud span:nth-child(2){transform:rotate(.6deg)}
.hud span:nth-child(3){transform:rotate(-.5deg)}
.hud b{color:var(--gold);font-weight:400;font-size:1.15rem}
canvas{border:6px solid var(--wood);outline:3px solid var(--sh);border-radius:4px;box-shadow:6px 7px 0 var(--sh)}
.ov{background:rgba(22,15,8,.84);border-radius:2px}
.ov h2{font-family:"Jua",sans-serif;font-weight:400;color:var(--gold);text-shadow:2px 3px 0 #000;letter-spacing:.03em}
button{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;background:var(--card);color:var(--fg);border:3px solid var(--line);border-radius:8px 6px 9px 6px;box-shadow:0 4px 0 var(--sh);padding:7px 6px;transition:transform .06s,box-shadow .06s}
button:hover:not(:disabled){background:var(--card2)}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
button:focus-visible{outline:3px dashed var(--gold);outline-offset:3px}
button:disabled{opacity:.5;box-shadow:0 2px 0 var(--sh)}
.pri{background:var(--acc);color:#fff7e6;text-shadow:1px 2px 0 rgba(0,0,0,.35);border-color:var(--sh)}
.pri:hover:not(:disabled){background:var(--acc);filter:brightness(1.1)}
.tb{gap:8px;margin:12px 0}
.tb button{font-size:.82rem;padding:7px 4px 6px}
.tb button i{border:2px solid var(--sh);border-radius:50%}
.tb button small{font-family:"Gowun Dodum",sans-serif;color:var(--mut)}
.tb button.on{background:var(--gold);border-color:var(--sh);box-shadow:0 1px 0 var(--sh);transform:translateY(3px);color:#2b1c0c}
.tb button.on small{color:#5a4120}
.info{background:var(--card);color:var(--fg);border:3px solid var(--line);border-radius:4px 11px 5px 9px;box-shadow:4px 5px 0 var(--sh);outline:1px dashed rgba(90,60,30,.4);outline-offset:-8px;padding:10px 14px;line-height:1.5}
.info strong{color:var(--acc)}
.info small{color:var(--mut)}
.ctl{gap:10px;margin-top:12px}
.row{gap:8px;margin-top:8px}
.stl button{transform:rotate(-1deg)}
.stl button:nth-child(even){transform:rotate(1.1deg)}
.stl button:hover:not(:disabled){transform:rotate(0) translateY(-2px)}
.stl button:active:not(:disabled){transform:translateY(3px)}
.stl small{color:var(--mut)}
.stl svg{border:2px solid var(--line);border-radius:2px}
.bq{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:"Jua",sans-serif;font-size:.85rem;color:var(--bgfg)}
.bq b{font-weight:400;color:var(--gold)}
.bq .bar{flex:1;height:14px;border:3px solid var(--sh);background:var(--wood);border-radius:4px;overflow:hidden}
.bq .bar i{display:block;height:100%;width:0;background:var(--gold)}
.bq span{min-width:96px;text-align:right}
#au{white-space:nowrap}
.lb{margin-top:10px}
.lbh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lbh input{flex:1;min-width:120px;font:inherit;font-family:"Jua",sans-serif;color:var(--fg);background:#fffaf0;border:3px solid var(--line);border-radius:6px;padding:5px 8px}
.lbh input:focus-visible{outline:3px dashed var(--gold);outline-offset:2px}
.lbt{display:flex;gap:6px;margin:8px 0}
.lbt button{flex:1;font-size:.8rem;padding:4px 2px}
.lbt button.on{background:var(--gold);transform:translateY(3px);box-shadow:0 1px 0 var(--sh)}
.lbr{display:grid;grid-template-columns:2em 1fr auto 4.5em;gap:8px;padding:3px 4px;border-bottom:1px dashed rgba(90,60,30,.3)}
.lbr b{text-align:right;font-family:"Jua",sans-serif;font-weight:400;color:var(--acc)}
.lbr.me{background:rgba(232,174,51,.3);border-radius:4px}
#ovr{font-size:.9rem;color:var(--gold);min-height:1.2em}
</style>
</head>
<body>
<main>
<h1>타워 디펜스</h1>
<div class="hud"><span>골드 <b id="gold"></b></span><span>생명 <b id="life"></b></span><span>웨이브 <b id="wv"></b> / <b id="wt">-</b></span></div>
<div class="wrap">
<canvas id="c" width="640" height="400" aria-label="게임 화면"></canvas>
<div class="ov" id="ov" hidden><h2 id="ovt"></h2><div id="ovs"></div><div id="ovr"></div><button class="pri" id="rs">다시 시작</button><button id="mn2">스테이지 선택</button></div>
<div class="ov" id="st"><h2>스테이지 선택</h2><div class="stl" id="stl"></div></div>
</div>
<div class="bq" id="bq"><b>현상금</b><div class="bar"><i id="bqf"></i></div><span id="bqt">-</span></div>
<div class="info" id="pv" style="min-height:0;margin-top:8px;padding:6px 12px"></div>
<div class="info" id="av" hidden style="margin-top:8px"></div>
<div class="info lb" id="lb"><div class="lbh"><strong>온라인 랭킹</strong><input id="nick" maxlength="12" placeholder="닉네임을 입력하세요" aria-label="닉네임"></div><div class="lbt" id="lbt"></div><div id="lbv"></div></div>
<div class="tb" id="tb"></div>
<div class="info" id="info"></div>
<div class="ctl"><button id="bm"></button><button id="br"></button><button id="bh"></button></div>
<div class="ctl"><button class="pri" id="nx">웨이브 시작</button><button id="spd">속도 x1</button><button id="au" title="여유로울 때 다음 웨이브를 미리 불러 보너스를 받아요">자동 OFF</button><button id="mn">스테이지</button><button id="bav">아바타</button></div>
</main>
<script>
const C=document.getElementById('c'),x=C.getContext('2d');
const T=40,W=16,H=10,$=id=>document.getElementById(id);
const MAPS=[
 [[0,1],[5,1],[5,4],[2,4],[2,7],[8,7],[8,3],[11,3],[11,8],[15,8]],
 [[0,8],[4,8],[4,5],[1,5],[1,2],[7,2],[7,6],[10,6],[10,1],[13,1],[13,5],[15,5]],
 [[0,0],[13,0],[13,2],[2,2],[2,4],[13,4],[13,6],[2,6],[2,8],[15,8]],
 [[0,5],[3,5],[3,1],[6,1],[6,8],[9,8],[9,3],[12,3],[12,7],[14,7],[14,0],[15,0]]
];
const MAPOB=[
 [[7,5],[7,6],[10,5],[1,8],[13,3],[4,2],[9,1],[14,5]],
 [[5,6],[5,3],[8,4],[12,3],[3,7],[14,2],[9,8],[0,4]],
 [[5,1],[8,1],[6,3],[9,3],[4,5],[10,5],[7,7],[12,7]],
 [[1,2],[4,6],[8,5],[11,1],[11,6],[13,9],[7,3],[1,8]]
];
let wpc,pts,road,cum,L,OB=new Set();
function setMap(i,ann){
 wpc=MAPS[i%MAPS.length];OB=new Set(MAPOB[i%MAPOB.length].map(p=>p[0]+','+p[1]));
 pts=wpc.map(p=>[p[0]*T+T/2,p[1]*T+T/2]);
 pts[0][0]=-T;pts[pts.length-1][0]=W*T+T;
 road=new Set();
 for(let k=0;k<wpc.length-1;k++){let[a,b]=wpc[k],[c,d]=wpc[k+1];
  for(let u=Math.min(a,c);u<=Math.max(a,c);u++)for(let v=Math.min(b,d);v<=Math.max(b,d);v++)road.add(u+','+v);}
 cum=[0];for(let k=1;k<pts.length;k++)cum.push(cum[k-1]+Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]));
 L=cum[cum.length-1];
 if(ann){let ref=0;
  S.tw=S.tw.filter(t=>{if(road.has(t.c+','+t.r)){ref+=t.inv;return false;}return true;});
  S.gold+=ref;if(S.sel&&!S.tw.includes(S.sel))S.sel=null;
  S.bn=3.5;S.bt='맵이 바뀝니다!'+(ref?' 길 위 포탑 환불 +'+ref+'G':'');}
}
function pos(d){let i=1;while(i<cum.length-1&&d>cum[i])i++;
 const t=(d-cum[i-1])/(cum[i]-cum[i-1]);
 return{x:pts[i-1][0]+(pts[i][0]-pts[i-1][0])*t,y:pts[i-1][1]+(pts[i][1]-pts[i-1][1])*t};}
const TD={
 g:{n:'기관포',c:50,r:100,d:12,cd:.4,col:'#4aa3ff',desc:'빠르게 연사하는 기본 포탑'},
 c:{n:'대포',c:100,r:95,d:34,cd:1.4,col:'#ff9f43',sp:48,desc:'범위 폭발로 뭉친 적을 처리'},
 s:{n:'저격',c:150,r:230,d:95,cd:2.1,col:'#b57cff',desc:'사거리가 길고 한 방이 강함'},
 i:{n:'얼음',c:75,r:92,d:4,cd:.8,col:'#4de1d2',sl:.5,desc:'맞은 적을 2초간 50% 감속'},
 z:{n:'번개',c:120,r:115,d:22,cd:.9,col:'#ffe14d',ch:3,desc:'적 사이를 튕기는 번개'},
 p:{n:'독',c:90,r:100,d:14,cd:1,col:'#6fd66f',po:1,desc:'3초간 지속 피해를 주는 독'},
 f:{n:'화염',c:110,r:72,d:10,cd:.35,col:'#ff5a3c',fl:1,desc:'사거리 안 모든 적을 태움'},
 k:{n:'지원',c:140,r:105,d:0,cd:9,col:'#f2f2f2',bf:1,desc:'범위 내 포탑 공격력 증가'}
};
const EN={
 n:{h:1,v:55,g:5,col:'#e8e2d0',r:9},
 f:{h:.6,v:100,g:4,col:'#ffd166',r:7},
 t:{h:3.2,v:36,g:12,col:'#8d99ae',r:12},
 b:{h:28,v:30,g:90,col:'#ef476f',r:15,boss:1},
 a:{h:2,v:45,g:9,col:'#9aa7b8',r:11,ar:.6},
 w:{h:.8,v:70,g:7,col:'#c3a6ff',r:8,fly:1},
 h:{h:1.3,v:48,g:10,col:'#7de2a0',r:10},
 s:{h:2.2,v:42,g:8,col:'#ff9ecb',r:12},
 m:{h:.4,v:75,g:2,col:'#ffc2de',r:6},
 x:{h:14,v:36,g:0,col:'#ffd23f',r:14,bty:1}
};
let S;
function init(){S={gold:130+15*P.lv.g,lives:10,wave:0,en:[],tw:[],pj:[],fx:[],q:[],sp:0,go:0,win:0,spd:1,sel:null,pick:'g',run:0,hov:null,bn:0,bt:'',dn:[],sk:0,sd:[],cd:{m:0,r:0},cast:0,stage:-1,hero:null,insp:null,bc:70,bo:null,at:0};setMap(0,false);$('ov').hidden=true;$('st').hidden=false;stages();ui();}
function startWave(a){
 if(S.stage<0||S.go||S.win||S.wave>=TW()||(S.run&&S.q.length))return;if(S.run){const g=15+S.wave*2;S.gold+=g;S.cd.m-=5;S.cd.r-=5;if(a===true){S.bn=1.6;S.bt='자동 조기 호출! +'+g+'G';}}
 S.wave++;S.run=1;S.sp=0;S.lk=0;const w=S.wave,n=Math.min(8+w*2,60);
 for(let i=0;i<n;i++){let k='n';if(w>2&&i%7==6)k='t';else if(w>3&&i%5==3)k='a';else if(w>4&&i%6==2)k='w';else if(w>5&&i%9==4)k='h';else if(w>6&&i%8==5)k='s';else if(w>1&&Math.random()<.4)k='f';S.q.push(k);}
 if(w%5==0)S.q.push('b');S.wn=S.q.length;
 ui();
}
function spawn(k){const b=EN[k],hp=36*Math.pow(STAGES[S.stage].g,S.wave)*b.h;
 S.en.push({k,d:0,hp,max:hp,v:b.v*(1+Math.min(S.wave,40)*.016),ar:b.ar,fly:b.fly,bty:b.bty,g:Math.round(b.g*.8)+Math.floor(S.wave/4),sl:0,r:b.r,col:b.col,boss:b.boss});}
function stat(t){const d=TD[t.k];let b=1;
 for(const o of S.tw)if(o!==t&&TD[o.k].bf&&Math.hypot(o.x-t.x,o.y-t.y)<=TD[o.k].r*(1+.08*(o.lv-1)))b+=.2+.05*o.lv;
 return{dmg:d.d*(1+.6*(t.lv-1))*b*(1+.03*P.lv.r),rng:d.r*(1+.08*(t.lv-1)),cd:d.cd*Math.max(.5,1-.06*(t.lv-1))};}
const COMBOS=[['c','i','빙결 폭발','감속된 적에게 대포 피해 x2'],['f','p','점화','중독된 적에게 화염 피해 x2'],['z','g','과부하','번개가 3번 더 튕김'],['s','i','동결 저격','감속된 적에게 저격 피해 x1.5']];
function crit(t){return Math.random()<(t.lv>=3?.15:0)+(t.lv>=5?.15:0);}
function near(t,k){return t.lv>=3&&S.tw.some(o=>o!==t&&o.k==k&&o.lv>=3&&Math.hypot(o.x-t.x,o.y-t.y)<=130);}
function cm(t,e){return cm0(t,e)*(e.ar&&'gcs'.includes(t.k)?1-e.ar:1);}
function cm0(t,e){const k=t.k;
 if(k=='c'&&e.sl>0&&near(t,'i'))return 2;
 if(k=='f'&&e.poi>0&&near(t,'p'))return 2;
 if(k=='s'&&e.sl>0&&near(t,'i'))return 1.5;
 return 1;}
function cinfo(t){return COMBOS.filter(c=>c[0]==t.k||c[1]==t.k).map(c=>{const o=t.k==c[0]?c[1]:c[0];return '<br>'+(near(t,o)?'✔ ':'· ')+'<strong>'+c[2]+'</strong> ('+TD[c[0]].n+'+'+TD[c[1]].n+') '+c[3];}).join('');}
function dnum(e,v,cr,col,s){const p=pos(e.d);S.dn.push({x:p.x+(Math.random()-.5)*12,y:p.y-e.r-8,s:s||(Math.round(v)+(cr?'!':'')),cr,col:col||'#fff',t:cr?1.2:.75,m:cr?1.2:.75});}
function hit(e,d,cr,q,col){e.hp-=d;
 if(!q){const p=pos(e.d);dnum(e,d,cr,col);S.fx.push({spark:1,x:p.x,y:p.y,r:cr?16:8,t:.15,m:.15,col:cr?'#fff7a0':(col||'#fff')});
  if(cr){S.fx.push({burst:1,x:p.x,y:p.y,t:.35,m:.35,col:'#ffcf33'});S.sk=Math.max(S.sk,.12);}}
 if(e.hp<=0&&!e.dead){e.dead=1;S.gold+=e.g;if(e.boss)bossReward();if(e.bty)bountyPay(e);if(e.k=='s')for(let i=0;i<2;i++){spawn('m');S.en[S.en.length-1].d=Math.max(0,e.d-i*12);}const p=pos(e.d);dnum(e,0,0,'#ffd23f','+'+e.g);S.fx.push({spark:1,x:p.x,y:p.y,r:e.r+8,t:.25,m:.25,col:e.col});ui();}}
function fire(t,e){const d=TD[t.k],s=stat(t),p=pos(e.d);let dm=s.dmg;t.ang=Math.atan2(p.y-t.y,p.x-t.x);
 if(t.k=='g'||t.k=='c'||t.k=='s'){const l=t.k=='s'?24:16;S.fx.push({spark:1,x:t.x+Math.cos(t.ang)*l,y:t.y-3+Math.sin(t.ang)*l,r:t.k=='c'?9:6,t:.08,m:.08,col:'#fff2a8'});}const cr=crit(t);if(cr)dm*=2.5;
 if(d.ch){const n=d.ch+(near(t,'g')?3:0),seen=[e];let cur=e,px=t.x,py=t.y;

 }catch(e){lbMsg('랭킹 기록에 실패했어요 ('+(e.code||'네트워크 오류')+')');}}
function lbTabs(){const t=$('lbt');t.innerHTML='';
 STAGES.forEach((st,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+st.n;if(i===lbTab)b.className='on';b.onclick=()=>{lbTab=i;loadLB();};t.appendChild(b);});}
async function loadLB(){lbTabs();const v=$('lbv');
 if(!FDB){v.textContent='랭킹 서버가 연결되지 않았어요. 파일 안의 FB_CONFIG를 채워 주세요.';return;}
 v.textContent='불러오는 중...';
 try{const q=await FDB.collection('scores_s'+lbTab).orderBy('score','desc').limit(10).get();
  if(q.empty){v.textContent='아직 기록이 없어요. 첫 번째로 이름을 올려 보세요.';return;}
  v.innerHTML='';let i=0;
  q.forEach(d=>{const r=d.data();i++;const row=document.createElement('div');row.className='lbr'+(d.id===PID?' me':'');
   for(const tx of[String(i),String(r.name),r.win?'클리어':'웨이브 '+r.wave,String(r.score)]){const c=document.createElement(row.children.length==3?'b':'span');c.textContent=tx;row.appendChild(c);}
   v.appendChild(row);});
 }catch(e){v.textContent='랭킹을 불러오지 못했어요 ('+(e.code||'네트워크 오류')+')';}}
init();loadLB();requestAnimationFrame(loop);
</script>
</body>
</html>
